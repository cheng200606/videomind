<text x="20" y="1269" font-size="11.5" font-weight="700" fill="#334155">图 3  顺序图 A：任务提交与异步解析</text>
<text x="20" y="1284" font-size="9" fill="#64748b">注：① 上传预检在落盘前完成，超限直接拒绝、不留孤儿批次；② ParseMutex 保证同一时刻仅一个批次解析，第二批次 409；紫色箭头为内存总线事件（不持久化）；</text>
<text x="20" y="1298" font-size="9" fill="#64748b">③ 阶段③按转写长度分块调用 LLM，逐块回传「结构化 i/N 段」；④ 单条失败不中断整批，部分成功时视频与批次终态均为 PARTIAL。</text>
