<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 1250" width="1520" height="1250" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, sans-serif">
<defs><marker id="a" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0.6,0.9 L9.4,5 L0.6,9.1 Z" fill="#334155"/></marker><marker id="av" viewBox="0 0 10 10" refX="9.2" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0.6,0.9 L9.4,5 L0.6,9.1 Z" fill="#8b5cf6"/></marker></defs>
<rect x="0" y="0" width="1520" height="1250" fill="#ffffff"/>
<text x="760.0" y="36" text-anchor="middle" font-size="15" font-weight="700" fill="#0f172a">图 7　状态机图：解析任务状态机（视频级 + 阶段级）与讲义修订状态机</text>
<rect x="30" y="60" width="1460" height="512" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="82" font-size="12" font-weight="700" fill="#0f172a">① 视频级 · VideoStatus —— 单条视频（Video 行）的解析状态，一次解析产生一个终态</text>
<rect x="30" y="594" width="1460" height="252" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="616" font-size="12" font-weight="700" fill="#0f172a">② 阶段级 · StageStatus —— 6 个具名状态：PENDING / RUNNING / DONE / PARTIAL / FAILED / SKIPPED（每个视频的 4 个阶段各自独立流转）</text>
<rect x="30" y="862" width="1460" height="250" rx="4" fill="#fbfcfe" stroke="#e2e8f0" stroke-width="1"/>
<text x="48" y="884" font-size="12" font-weight="700" fill="#0f172a">③ 讲义级 · RevisionState —— 条目修订留痕，转移表见 REVISION_TRANSITIONS（非法跳转 422）</text>
