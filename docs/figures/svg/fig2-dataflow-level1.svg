666" fill="none" stroke="#334155" stroke-width="1.15" marker-end="url(#solid)"/><text x="630.0" y="658.0" font-size="9" fill="#334155" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">条目 · 证据 · 产物 · 修订</text><path d="M380,660 L330,660 L330,595 L360,595" fill="none" stroke="#334155" stroke-width="1.15" marker-end="url(#solid)"/><text x="334.0" y="682.0" font-size="9" fill="#334155" text-anchor="start" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">阶段事件</text><path d="M280,555 L280,209 L190,209" fill="none" stroke="#7C3AED" stroke-width="1.15" stroke-dasharray="5 3" marker-end="url(#violet)"/><text x="286.0" y="315.0" font-size="9" fill="#334155" text-anchor="start" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">进度事件（SSE 订阅）</text><path d="M115,209 L115,843 L380,843" fill="none" stroke="#334155" stroke-width="1.15" marker-end="url(#solid)"/><text x="200.0" y="835.0" font-size="9" fill="#334155" text-anchor="middle" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">检索 / 导出请求</text><path d="M690,682 L660,682 L660,830 L570,830" fill="none" stroke="#334155" stroke-width="1.15" marker-end="url(#solid)"/><text x="656.0" y="762.0" font-size="9" fill="#334155" text-anchor="end" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">条目 · 证据 · 批注 · 修订</text><path d="M475,881 L475,930" fill="none" stroke="#334155" stroke-width="1.15" marker-end="url(#solid)"/><text x="480.0" y="906.0" font-size="9" fill="#334155" text-anchor="start" dominant-baseline="middle" paint-order="stroke" stroke="#ffffff" stroke-width="4.2" stroke-linejoin="round">批次 Markdown 文稿</text><text x="40" y="1010" font-size="12" font-weight="700" fill="#0f172a" dominant-baseline="middle">图 2　数据流图 · 1 层分解：四阶段解析主干（P1→P2→P3→P4→P5）与检索导出（P6），四处数据存储</text><text x="40" y="1025" font-size="9" font-weight="400" fill="#64748B" dominant-baseline="middle">注①：与 0 层平衡——P1～P6 对外的净输入与净输出，恰为 0 层图中系统框的那六条数据流，未新增也未丢失接口</text><text x="40" y="1040" font-size="9" font-weight="400" fill="#64748B" dominant-baseline="middle">注②：D2 与 E2 各出现两次，表示同一存储、同一实体（上部写批次与片段，下部供检索导出），为缩短连线而重复画</text><text x="40" y="1055" font-size="9" font-weight="400" fill="#64748B" dominant-baseline="middle">注③：D4 为进程内内存总线（每批保留最近 256 条事件），明确不做队列持久化，进程重启即丢；紫色虚线即此类非持久事件</text><text x="40" y="1070" font-size="9" font-weight="400" fill="#64748B" dominant-baseline="middle">注④：P3 输出的画面文本不落库，直接进 P4；D3 缓存键＝文件名＋文件大小＋引擎档位，命中则跳过该条转写</text><text x="40" y="1085" font-size="9" font-weight="400" fill="#64748B" dominant-baseline="middle">注⑤：P2 失败即该条终止（视频 FAILED）；P4 分块失败把阶段与视频置 PARTIAL，单条失败不中断整批，重试只重跑该条</text></svg>