<text x="739.0" y="64" text-anchor="middle" font-size="9" fill="#475569">SQLite（条目 / 证据 / 笔记 / 版本）</text>
<line x1="739.0" y1="78" x2="739.0" y2="607" stroke="#a9b6c8" stroke-width="1" stroke-dasharray="5,4"/>
<rect x="21" y="383" width="856" height="150" fill="none" stroke="#64748b" stroke-width="1.1"/>
<path d="M21,383 h42 v14 h-42 z" fill="#e8eef6" stroke="#64748b" stroke-width="1.1"/>
<text x="25" y="393.5" font-size="9.5" font-weight="700" fill="#334155">opt</text>
<text x="69.6" y="393.5" font-size="9.5" fill="#334155">[笔记写入：锚点默认继承条目]</text>
<line x1="160.0" y1="172" x2="448.0" y2="172" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="304.0" y="166" text-anchor="middle" font-size="10" fill="#1e293b">GET /videos/{id}/items · /transcript</text>
<line x1="448.0" y1="200" x2="160.0" y2="200" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#open)"/>
<text x="304.0" y="194" text-anchor="middle" font-size="10" fill="#1e293b">items（含 summary.payload.chapters）</text>
<path d="M162.0,228 L185.0,228 L185.0,242 L166.0,242" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="189.0" y="232" font-size="10" fill="#1e293b">点章节 / 刻度 → seek(start_ms)</text>
<path d="M162.0,256 L185.0,256 L185.0,270 L166.0,270" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="189.0" y="260" font-size="10" fill="#1e293b">video.currentTime = ms / 1000</text>
<line x1="160.0" y1="284" x2="448.0" y2="284" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="304.0" y="278" text-anchor="middle" font-size="10" fill="#1e293b">GET /items/{item_id}</text>
<line x1="450.0" y1="312" x2="738.0" y2="312" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="594.0" y="306" text-anchor="middle" font-size="10" fill="#1e293b">SELECT 条目 + 证据 + 版本 + 笔记</text>
<line x1="448.0" y1="340" x2="160.0" y2="340" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#open)"/>
<text x="304.0" y="334" text-anchor="middle" font-size="10" fill="#1e293b">条目详情（notes / revisions / conflicts）</text>
<path d="M162.0,368 L185.0,368 L185.0,382 L166.0,382" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="189.0" y="372" font-size="10" fill="#1e293b">新建笔记 → 路由 /notes/{item_id}</text>
<line x1="160.0" y1="409" x2="448.0" y2="409" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="304.0" y="403" text-anchor="middle" font-size="10" fill="#1e293b">POST /items/{id}/notes</text>
<path d="M452.0,437 L475.0,437 L475.0,451 L456.0,451" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="479.0" y="441" font-size="10" fill="#1e293b">anchor_ms = 入参 or 条目锚点</text>
<line x1="450.0" y1="465" x2="738.0" y2="465" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="594.0" y="459" text-anchor="middle" font-size="10" fill="#1e293b">INSERT Note → commit</text>
<line x1="448.0" y1="493" x2="160.0" y2="493" stroke="#64748b" stroke-width="1.2" stroke-dasharray="6,3" marker-end="url(#open)"/>
<text x="304.0" y="487" text-anchor="middle" font-size="10" fill="#1e293b">201 {id, anchor_ms}</text>
<line x1="160.0" y1="521" x2="448.0" y2="521" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="304.0" y="515" text-anchor="middle" font-size="10" fill="#1e293b">GET /items/{id}（刷新笔记列表）</text>
<path d="M162.0,549 L185.0,549 L185.0,563 L166.0,563" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#solid)"/>
<text x="189.0" y="553" font-size="10" fill="#1e293b">点笔记时间码 → seek(anchor_ms) 回原片</text>
<text x="24" y="615" font-size="11.5" font-weight="700" fill="#334155">图 4  顺序图 B：大纲跳转与笔记写入</text>
<text x="24" y="630" font-size="9" fill="#64748b">注：① 章节数据随条目一次取回（summary 产物的 payload.chapters），大纲点击与产物面板点击共用同一 seek 入口；② 跳转只赋值 video.currentTime，无网络往返；</text>
<text x="24" y="644" font-size="9" fill="#64748b">③ 笔记默认继承条目 anchor_ms，经条目时间码可反向跳回原片；讲义正文修改另走 POST /items/{id}/revision，追加版本快照并校验状态机。</text>
</svg>